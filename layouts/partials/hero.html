{{ with index hugo.Data .Language.Lang "hero" }}
{{ if .enable }}

<section class="hero">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-lg-12">
        <div class="hero-content">

          {{ with .logo }}
            <img
              class="hero-logo"
              src="{{ . | relURL }}"
              alt="Arbeitsrecht Winter">
          {{ end }}

        </div>
      </div>
    </div>
  </div>
</section>

{{ end }}
{{ end }}
