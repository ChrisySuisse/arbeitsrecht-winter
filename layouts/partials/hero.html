{{ with index hugo.Data .Language.Lang "hero" }}
{{if .enable}}

  {{ $hero := resources.Get .heroBGimg }}
  {{ $heroOptimized := $hero.Resize "1920x webp q80" }}

  <section
      class="hero"
      style="background-image: url('{{ $heroOptimized.RelPermalink }}');">

      <div class="container">
        <div class="row align-items-center">
          <div class="col-lg-12">
            <div class="hero-content">

              {{ with .logo }}
                <img
                  src="{{ . }}"
                  width="60%"
                  alt="Arbeitsrecht Winter">
              {{ end }}

            </div>
          </div>
        </div>
      </div>

    </section>


 
  {{end}}
{{end}}
