{{ with index hugo.Data .Language.Lang "service" }}
{{ if .enable }}
<section class="service" id="service">
  <div class="container">

    <div class="row">
      <div class="col-lg-12">
        <div class="service-intro">
          <h2>{{ .title }}</h2>

          <p class="service-subtitle">
            {{ .subtitle }}
          </p>
        </div>
      </div>
    </div>

    <div class="service-divider" aria-hidden="true"></div>

    <div class="service-list">
      {{ range .services }}
      <div class="service-entry reveal-service">
        <h3>
          {{ if .link }}
          <a href="{{ .link }}">{{ .name }}</a>
          {{ else }}
          {{ .name }}
          {{ end }}
        </h3>

        <p>
          {{ .description }}
        </p>
      </div>
      {{ end }}
    </div>

  </div>
</section>
{{ end }}
{{ end }}
