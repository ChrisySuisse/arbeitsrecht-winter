title: "Frequently Asked Questions"
faq:
  - question: "Wie kann ich die Kanzlei erreichen?"
    answer: |
            Buchen Sie am besten einen Termin über das <a href="/contact">Buchungstool</a> oder schreiben Sie mir eine <a href="mailto:christina.winter@arbeitsrecht-winter.ch">E-Mail</a>. Gerne bin ich auch per <a href="tel:+41767789701">Handy oder WhatsApp</a> zu erreichen. Die erste unverbindliche Kontaktaufnahme ist selbstverständlich kostenlos.
  - question: "Wo kann ich Sie überall vertreten?"
    answer: |
            Ich bin als eingetragene Anwältin im Basler Anwaltsregister und Mitglied des Schweizer und Basler Anwaltsverbandes zur rechtlichen Vertretung vor allen Gerichten und Behörden der Schweiz zugelassen.
  - question: "Wozu dient das erste Klientengespräch?"
    answer: |
            Bei einem ersten Kontakt klären wir die gegenseitigen Erwartungen. Am besten schildern Sie mir den Sachverhalt und das angestrebte Ziel. Ich kann Ihnen dann eine persönliche Einschätzung der Erfolgsaussichten auf der Grundlage der von Ihnen geschilderten Fakten geben und die Konditionen erläutern, unter denen ich den Auftrag übernehmen kann. Für meine Arbeit ist es unerlässlich, ein Gefühl für die Interessen und die Denkweise des Mandanten zu entwickeln. Dazu ist ein erstes Gespräch erforderlich. Dieses kann persönlich oder per Videokonferenz stattfinden. Ich biete auch Gesprächstermine zu Randzeiten an.
  - question: "Was sind die Kosten?"
    answer: |
            Mir ist wichtig, dass die Anwaltskosten für Sie transparent und fair sind und Sie sich mit Ihrem Anliegen gut aufgehoben fühlen. Vor einer Mandatierung biete ich grundsätzlich eine kostenlose Erstberatung zur ersten Orientierung und zur Einschätzung des weiteren Vorgehens an.
            
            In der Regel verrechne ich den im Rahmen des Mandats anfallenden Zeitaufwand. Mein Stundensatz liegt je nach Fachgebiet, Komplexität und Dringlichkeit zwischen netto CHF 270 und CHF 300. Zusätzlich fällt eine aufwandsabhängige Spesenpauschale von 1 bis 3 % an. Der tatsächliche Aufwand richtet sich nach den konkreten Umständen des Einzelfalls. In begründeten Fällen trage ich auch Ihrer wirtschaftlichen Leistungsfähigkeit Rechnung.
            
            Die Kosten sollen für Sie möglichst absehbar bleiben. Deshalb erhalten Sie auf Grundlage des jeweiligen Verfahrensstands und meines aktuellen Kenntnisstands eine möglichst realistische Einschätzung der zu erwartenden Kosten.
            
            Gerade im Arbeitsrecht übernehmen Rechtsschutzversicherungen häufig einen erheblichen Teil der Anwaltskosten. Es ist daher sinnvoll, eine allfällige Kostendeckung bereits vor der Mandatierung abzuklären. Gerne unterstütze ich Sie dabei.
